name: CI

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # pnpm 7 matches lockfileVersion 5.x
      - uses: pnpm/action-setup@v4
        with:
          version: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: pnpm i --frozen-lockfile
      - name: Lint
        run: npm run lint
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: pnpm i --frozen-lockfile
      - name: Unit tests
        run: npm run test
  docs_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - run: pnpm i --frozen-lockfile
      - name: Build docs
        run: npm run docs:build
